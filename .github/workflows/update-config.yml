name: Update KV Configuration

on:
  push:
    paths:
      - 'config.json'
    branches:
      - main

jobs:
  update-kv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject Secret Prefixes and Push to Cloudflare
        env:
          # Pass the secret securely into the environment
          SECRET_PREFIXES: ${{ secrets.SECRET_PREFIXES }}
        run: |
          echo "Injecting private prefixes into configuration..."
          
          # Use jq to replace the empty array with your secret array
          jq --argjson prefixes "$SECRET_PREFIXES" '.ALLOW_LIST_PREFIXES = $prefixes' config.json > payload.json
          
          echo "Uploading injected configuration to Cloudflare KV Namespace..."
          
          RESPONSE_CODE=$(curl -s -o response.json -w "%{http_code}" -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_NAMESPACE_ID }}/values/ddns_config" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @payload.json)
            
          if [ "$RESPONSE_CODE" -eq 200 ]; then
            echo "✅ Configuration successfully updated in Cloudflare KV!"
          else
            echo "❌ Failed to update KV. HTTP Status: $RESPONSE_CODE"
            cat response.json
            exit 1
          fi
