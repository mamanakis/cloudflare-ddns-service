services:
  wrangler-dev:
    # Switched to Debian slim to support the glibc workerd binary
    image: node:22-slim
    container_name: omada-ddns-dev
    working_dir: /app
    volumes:
      - ./workspace:/app
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      - CI=true
      - WRANGLER_SEND_METRICS=false
    command: |
      sh -c '
        echo "Installing dependencies..."
        # Switched to apt-get for Debian package management
        apt-get update > /dev/null 2>&1
        apt-get install -y git > /dev/null 2>&1
        npm install -g wrangler > /dev/null 2>&1
        
        # Prevent "dubious ownership" errors caused by Docker volume mounts
        git config --global --add safe.directory /app
        
        # Clone or Pull
        if [ ! -f "wrangler.toml" ]; then
          echo "Workspace empty. Cloning repository..."
          git clone "$$GIT_REPO_URL" .
        else
          echo "Repository found. Pulling latest changes..."
          git pull
        fi
        
        # Generate the .dev.vars file required by Wrangler for local secrets (ZONE_ID removed)
        echo "Injecting secrets into .dev.vars..."
        echo "API_TOKEN=$$API_TOKEN" > .dev.vars
        echo "USERNAME=$$USERNAME" >> .dev.vars
        echo "PASSWORD=$$PASSWORD" >> .dev.vars
        
        echo "Starting Wrangler dev server..."
        wrangler dev --ip 0.0.0.0
      '
