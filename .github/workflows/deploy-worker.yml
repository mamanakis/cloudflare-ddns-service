name: Deploy Worker

on:
  workflow_dispatch: 
  push:
    paths:
      - 'src/**'
      - 'wrangler.toml'
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject KV Namespace ID
        run: sed -i "s/YOUR_KV_NAMESPACE_ID/${{ secrets.CF_KV_NAMESPACE_ID }}/g" wrangler.toml

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          secrets: |
            API_TOKEN
            USERNAME
            PASSWORD
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
  update-kv:
    needs: deploy # Ensures the worker is successfully deployed before pushing the config
    uses: ./.github/workflows/update-config.yml
    secrets: inherit
